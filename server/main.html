<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeLink — Emergency AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Noto+Sans+Telugu:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #ff2233;
    --red-dim: #cc1122;
    --red-glow: rgba(255,34,51,0.35);
    --amber: #ffaa00;
    --amber-glow: rgba(255,170,0,0.3);
    --green: #00ff88;
    --green-glow: rgba(0,255,136,0.25);
    --bg: #050508;
    --surface: #0a0a10;
    --surface2: #0f0f18;
    --border: rgba(255,34,51,0.18);
    --text: #e8e8f0;
    --text-dim: #6a6a80;
    --font-head: 'Rajdhani', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,34,51,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,34,51,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,34,51,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 110px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 2px solid var(--red);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 44px; height: 44px;
    background: var(--red);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    animation: pulse-icon 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse-icon {
    0%, 100% { box-shadow: 0 0 0 0 var(--red-glow); }
    50% { box-shadow: 0 0 20px 8px var(--red-glow); }
  }
  .logo-text h1 {
    font-family: var(--font-head);
    font-size: 26px; font-weight: 700;
    letter-spacing: 4px; color: #fff; line-height: 1;
  }
  .logo-text span {
    font-family: var(--font-mono);
    font-size: 9px; color: var(--red);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .status-bar { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .status-dot {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--green); letter-spacing: 1px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green-glow);
    animation: blink-dot 1.5s ease-in-out infinite;
  }
  @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .lang-badge {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--amber); letter-spacing: 1px;
  }

  /* Alert */
  .alert-banner {
    display: none;
    padding: 10px 16px;
    border: 1px solid;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
    animation: slide-in 0.3s ease-out;
  }
  .alert-banner.show { display: flex; align-items: center; gap: 8px; }
  .alert-banner.error { border-color: var(--red); color: var(--red); background: rgba(255,34,51,0.08); }
  .alert-banner.info  { border-color: var(--amber); color: var(--amber); background: rgba(255,170,0,0.08); }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  /* Quick buttons */
  .section-label {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 8px;
    cursor: pointer;
    font-family: var(--font-head);
    font-size: 12px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; text-align: center;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .quick-btn .qb-icon { font-size: 20px; }
  .quick-btn.accident { border-color: rgba(255,100,0,0.3); }
  .quick-btn.health   { border-color: rgba(255,34,51,0.3); }
  .quick-btn.women    { border-color: rgba(180,0,255,0.3); }
  .quick-btn:hover { background: rgba(255,34,51,0.12); border-color: var(--red); color: var(--red); box-shadow: 0 0 16px var(--red-glow); }
  .quick-btn.accident:hover { border-color: #ff6400; color: #ff6400; box-shadow: 0 0 16px rgba(255,100,0,0.3); }
  .quick-btn.women:hover    { border-color: #b400ff; color: #b400ff; box-shadow: 0 0 16px rgba(180,0,255,0.3); }

  /* Voice Core */
  .voice-core {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 32px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .voice-core::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .orb-wrap {
    position: relative; width: 160px; height: 160px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .orb-ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--red); opacity: 0;
  }
  .orb-ring:nth-child(1) { width: 100%; height: 100%; }
  .orb-ring:nth-child(2) { width: 80%;  height: 80%; border-color: var(--amber); }
  .orb-ring:nth-child(3) { width: 60%;  height: 60%; }
  .orb-wrap.listening .orb-ring:nth-child(1) { animation: ring-out 1.4s ease-out infinite; }
  .orb-wrap.listening .orb-ring:nth-child(2) { animation: ring-out 1.4s ease-out 0.28s infinite; }
  .orb-wrap.listening .orb-ring:nth-child(3) { animation: ring-out 1.4s ease-out 0.56s infinite; }
  @keyframes ring-out { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }

  .orb {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,80,80,0.3), rgba(255,34,51,0.05));
    border: 2px solid var(--red);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 30px rgba(255,34,51,0.15), inset 0 0 30px rgba(255,34,51,0.05);
    transition: all 0.3s;
    user-select: none;
  }
  .orb-wrap:hover .orb { box-shadow: 0 0 50px var(--red-glow), inset 0 0 40px rgba(255,34,51,0.1); transform: scale(1.04); }
  .orb-wrap.listening .orb {
    background: radial-gradient(circle at 35% 35%, rgba(255,80,80,0.5), rgba(255,34,51,0.15));
    box-shadow: 0 0 60px var(--red-glow), inset 0 0 40px rgba(255,34,51,0.2);
    animation: orb-breathe 1.2s ease-in-out infinite;
  }
  .orb-wrap.speaking .orb {
    background: radial-gradient(circle at 35% 35%, rgba(0,255,136,0.3), rgba(0,200,100,0.05));
    border-color: var(--green);
    box-shadow: 0 0 60px var(--green-glow), inset 0 0 40px rgba(0,255,136,0.1);
    animation: orb-speak 0.6s ease-in-out infinite alternate;
  }
  @keyframes orb-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes orb-speak   { 0% { transform: scale(1); } 100% { transform: scale(1.07); } }

  .orb-label {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
    transition: color 0.3s;
  }

  /* Waveform */
  .waveform {
    display: flex; align-items: center; gap: 3px;
    height: 36px; opacity: 0; transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .wave-bar { width: 3px; border-radius: 2px; background: var(--red); height: 4px; }
  .waveform.listening .wave-bar { animation: wave-anim 0.5s ease-in-out infinite alternate; }
  .waveform.speaking  .wave-bar {
    background: var(--green);
    animation: wave-speak 0.4s ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(1)  { animation-delay: 0.00s; }
  .wave-bar:nth-child(2)  { animation-delay: 0.04s; }
  .wave-bar:nth-child(3)  { animation-delay: 0.08s; }
  .wave-bar:nth-child(4)  { animation-delay: 0.12s; }
  .wave-bar:nth-child(5)  { animation-delay: 0.16s; }
  .wave-bar:nth-child(6)  { animation-delay: 0.12s; }
  .wave-bar:nth-child(7)  { animation-delay: 0.08s; }
  .wave-bar:nth-child(8)  { animation-delay: 0.04s; }
  .wave-bar:nth-child(9)  { animation-delay: 0.00s; }
  .wave-bar:nth-child(10) { animation-delay: 0.04s; }
  .wave-bar:nth-child(11) { animation-delay: 0.08s; }
  .wave-bar:nth-child(12) { animation-delay: 0.12s; }
  @keyframes wave-anim  { 0% { height: 4px; } 100% { height: 28px; } }
  @keyframes wave-speak { 0% { height: 6px; } 100% { height: 24px; } }

  /* Transcript */
  .transcript-wrap { width: 100%; }
  .transcript-label {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
  }
  .transcript-box {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 2px solid var(--border);
    padding: 12px 16px;
    min-height: 52px; max-height: 90px;
    overflow-y: auto;
    font-size: 14px; line-height: 1.5;
    color: var(--text-dim);
    font-family: 'Noto Sans Telugu', var(--font-body);
    transition: border-color 0.3s, color 0.3s;
  }
  .transcript-box.active { color: var(--text); border-left-color: var(--red); }

  /* Conversation */
  .convo-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    max-height: 360px;
    overflow-y: auto; scroll-behavior: smooth;
  }
  .convo-box::-webkit-scrollbar { width: 3px; }
  .convo-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex; gap: 10px; align-items: flex-start;
    animation: msg-in 0.3s ease-out;
  }
  @keyframes msg-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.agent .msg-avatar { background: rgba(255,34,51,0.15); border: 1px solid rgba(255,34,51,0.3); }
  .msg.user  .msg-avatar { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }

  .msg-inner { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user .msg-inner { align-items: flex-end; }

  .msg-bubble {
    padding: 10px 14px; font-size: 14px; line-height: 1.65;
    font-family: 'Noto Sans Telugu', var(--font-body);
  }
  .msg.agent .msg-bubble {
    background: rgba(255,34,51,0.06);
    border: 1px solid rgba(255,34,51,0.15);
    border-left: 2px solid var(--red); color: var(--text);
  }
  .msg.user .msg-bubble {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-right: 2px solid rgba(255,255,255,0.2);
    color: var(--text-dim); text-align: right;
  }
  .msg-time {
    font-family: var(--font-mono); font-size: 9px;
    color: var(--text-dim); margin-top: 3px; opacity: 0.5; padding: 0 2px;
  }

  .thinking { display: flex; gap: 5px; padding: 10px 14px; align-items: center; }
  .think-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red); animation: think 1s ease-in-out infinite;
  }
  .think-dot:nth-child(2) { animation-delay: 0.2s; }
  .think-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes think { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  /* Empty state */
  .empty-state { text-align: center; padding: 30px; color: var(--text-dim); }
  .empty-state .es-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }
  .empty-state p { font-size: 11px; font-family: var(--font-mono); letter-spacing: 1px; line-height: 2; }

  /* SOS Footer */
  .sos-strip {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; gap: 10px; align-items: center; z-index: 50;
  }
  .sos-btn {
    flex: 1; background: var(--red); color: #fff; border: none;
    padding: 14px;
    font-family: var(--font-head); font-size: 18px; font-weight: 700;
    letter-spacing: 6px; cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: all 0.2s;
    animation: sos-pulse 3s ease-in-out infinite;
  }
  .sos-btn:hover { background: #ff0011; box-shadow: 0 0 30px var(--red-glow); animation: none; transform: scale(1.02); }
  @keyframes sos-pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--red-glow); } 50% { box-shadow: 0 0 20px 4px var(--red-glow); } }

  .num-call {
    background: var(--surface);
    border: 1px solid rgba(255,170,0,0.3);
    color: var(--amber);
    padding: 12px 16px;
    font-family: var(--font-head); font-size: 20px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px;
    text-decoration: none;
    display: flex; align-items: center; gap: 4px;
    transition: all 0.2s; white-space: nowrap;
  }
  .num-call:hover { background: rgba(255,170,0,0.08); box-shadow: 0 0 16px var(--amber-glow); }
</style>
</head>
<body>
<div class="scanlines"></div>

<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">🔴</div>
      <div class="logo-text">
        <h1>LIFELINK</h1>
        <span>Emergency AI Response</span>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot"><div class="dot"></div>ONLINE</div>
      <div class="lang-badge" id="langBadge">LANG: AUTO</div>
    </div>
  </header>

  <div class="alert-banner" id="alertBanner"></div>

 

  <div class="section-label">Voice Agent</div>
  <div class="voice-core">
    <div class="orb-wrap" id="orbWrap" onclick="toggleListen()">
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb" id="orb">🎙️</div>
    </div>
    <div class="orb-label" id="orbLabel">TAP TO SPEAK</div>

    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="transcript-wrap">
      <div class="transcript-label">You said</div>
      <div class="transcript-box" id="transcriptBox">Start speaking to LifeLink…</div>
    </div>
  </div>

  <div class="section-label">Conversation</div>
  <div class="convo-box" id="convoBox">
    <div class="empty-state">
      <div class="es-icon">🔴</div>
      <p>Tap the orb or a quick button to begin</p>
      <p>English · తెలుగు · தமிழ் · ಕನ್ನಡ · हिंदी</p>
    </div>
  </div>

</div>


<script>
// ── API Base ─────────────────────────────────────────────────────────────────
// When opened via Live Server (port 5500) relative URLs go to the wrong host.
// Point them at the Express server instead.
const API_BASE = (window.location.port === '5500' || window.location.protocol === 'file:')
  ? 'http://localhost:3000'
  : '';

// ── State ──────────────────────────────────────────────────────────────────
let isListening              = false;
let isSpeaking               = false;
let recognition              = null;
let history                  = [];
let currentLang              = 'en-IN';
let alertTimer               = null;
let emergencyAlreadyTriggered = false;

// ── STT language — default to browser locale if supported, else en-IN ────────
const SUPPORTED_STT = ['en-IN', 'te-IN', 'ta-IN', 'hi-IN', 'kn-IN'];
const browserLang   = (navigator.language || 'en-IN').replace('_', '-');
let sttLang = SUPPORTED_STT.find(l => browserLang.startsWith(l.split('-')[0])) || 'en-IN';

// ── Language Detection ─────────────────────────────────────────────────────
function detectLang(text) {
  if (/[\u0C00-\u0C7F]/.test(text)) return 'te-IN';
  if (/[\u0B80-\u0BFF]/.test(text)) return 'ta-IN';
  if (/[\u0C80-\u0CFF]/.test(text)) return 'kn-IN';
  if (/[\u0900-\u097F]/.test(text)) return 'hi-IN';
  return 'en-IN';
}

// ── Speech Recognition ─────────────────────────────────────────────────────
function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showAlert('Voice recognition not supported. Use Chrome or Edge.', 'error');
    return null;
  }
  const r = new SR();
  r.continuous     = false;
  r.interimResults = true;
  r.lang           = sttLang;

  r.onstart = () => setOrbState('listening');

  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final += t) : (interim += t);
    }
    updateTranscript(final || interim, !!final);
    if (final) {
      // Adapt STT language to whatever script the user spoke
      sttLang = detectLang(final) || sttLang;
      isListening = false;
      handleUserMessage(final.trim());
    }
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech') {
      showAlert('No speech detected. Tap and speak again.', 'info');
    } else if (e.error !== 'aborted') {
      showAlert('Mic error: ' + e.error, 'error');
    }
    isListening = false;
    setOrbState('idle');
  };

  r.onend = () => {
    if (isListening) {
      try { recognition.lang = sttLang; recognition.start(); } catch(e) {}
    } else if (!isSpeaking) {
      setOrbState('idle');
    }
  };

  return r;
}

// ── Orb State ──────────────────────────────────────────────────────────────
function setOrbState(state) {
  const wrap = document.getElementById('orbWrap');
  const orb  = document.getElementById('orb');
  const lbl  = document.getElementById('orbLabel');
  const wf   = document.getElementById('waveform');

  wrap.className = 'orb-wrap';
  wf.className   = 'waveform';

  if (state === 'listening') {
    wrap.classList.add('listening');
    wf.classList.add('active', 'listening');
    orb.textContent = '🎙️';
    lbl.textContent = 'LISTENING…';
    lbl.style.color = 'var(--red)';
  } else if (state === 'thinking') {
    wf.classList.add('active');
    orb.textContent = '⏳';
    lbl.textContent = 'PROCESSING…';
    lbl.style.color = 'var(--amber)';
  } else if (state === 'speaking') {
    wrap.classList.add('speaking');
    wf.classList.add('active', 'speaking');
    orb.textContent = '🔊';
    lbl.textContent = 'AGENT SPEAKING';
    lbl.style.color = 'var(--green)';
  } else {
    orb.textContent = '🎙️';
    lbl.textContent = 'TAP TO SPEAK';
    lbl.style.color = 'var(--text-dim)';
  }
}

function updateTranscript(text, isFinal) {
  const box = document.getElementById('transcriptBox');
  box.textContent = text || 'Listening…';
  box.classList.toggle('active', !!(text && isFinal));
}

// ── Toggle Listen ──────────────────────────────────────────────────────────
function toggleListen() {
  if (isSpeaking) return;

  if (isListening) {
    isListening = false;
    recognition?.stop();
    setOrbState('idle');
    return;
  }

  recognition = buildRecognition();
  if (!recognition) return;

  isListening = true;
  updateTranscript('', false);
  try { recognition.start(); } catch(e) { isListening = false; setOrbState('idle'); }
}

function quickSend(text) {
  if (isListening) { recognition?.stop(); isListening = false; }
  updateTranscript(text, true);
  handleUserMessage(text);
}

// ── Chat ───────────────────────────────────────────────────────────────────
async function handleUserMessage(text) {
  if (!text) return;
  setOrbState('thinking');
  addMessage('user', text);
  const thinkId = addThinking();

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history, emergencyAlreadyTriggered }),
    });
    const data = await res.json();
    removeThinking(thinkId);

    if (data.error) {
      const msg = data.fallback || data.error;
      addMessage('agent', msg);
      showAlert(data.error, 'error');
      setOrbState('idle');
      fallbackTTS(msg, 'en-IN');
      return;
    }

    if (data.detectedInputLang) {
      currentLang = data.replyLang?.code || data.detectedInputLang.code;
      document.getElementById('langBadge').textContent =
        'LANG: ' + (data.detectedInputLang.name || 'AUTO').toUpperCase();
    }

    // ── Emergency services triggered ────────────────────────────────────
    if (data.emergencyTriggered) {
      emergencyAlreadyTriggered = true;
      showAlert('🚨 Emergency services notified — SMS sent & call placed to your emergency contact!', 'error');
      addMessage('agent', '🚨 I have alerted your emergency contact via SMS and phone call. Help is on the way. Stay calm and follow my instructions.');
    }

    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: data.reply });

    addMessage('agent', data.reply);
    speakAzure(data.reply, data.replyLang?.code || currentLang);

  } catch (err) {
    removeThinking(thinkId);
    const msg = 'Connection error. Please call 112 immediately.';
    addMessage('agent', msg);
    showAlert('Offline. Emergency: 112', 'error');
    setOrbState('idle');
    fallbackTTS(msg, 'en-IN');
  }
}

// ── Azure TTS ──────────────────────────────────────────────────────────────
async function speakAzure(text, lang) {
  isSpeaking = true;
  setOrbState('speaking');

  try {
    const res = await fetch(`${API_BASE}/api/speak`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, lang: lang || 'en-IN' }),
    });
    if (!res.ok) throw new Error('TTS API error');

    const blob  = await res.blob();
    const url   = URL.createObjectURL(blob);
    const audio = new Audio(url);

    audio.onended = () => { URL.revokeObjectURL(url); isSpeaking = false; setOrbState('idle'); };
    audio.onerror = () => { URL.revokeObjectURL(url); isSpeaking = false; fallbackTTS(text, lang); };
    await audio.play();

  } catch (e) {
    console.warn('Azure TTS failed:', e);
    isSpeaking = false;
    fallbackTTS(text, lang);
  }
}

function fallbackTTS(text, lang) {
  if (!window.speechSynthesis) { isSpeaking = false; setOrbState('idle'); return; }
  isSpeaking = true;
  setOrbState('speaking');

  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = lang || 'en-IN';
  utt.rate  = 0.9;

  const voices = window.speechSynthesis.getVoices();
  const match  = voices.find(v => v.lang === lang) ||
                 voices.find(v => v.lang.startsWith((lang||'en').split('-')[0]));
  if (match) utt.voice = match;

  utt.onend = utt.onerror = () => { isSpeaking = false; setOrbState('idle'); };
  window.speechSynthesis.speak(utt);
}

// ── Conversation UI ────────────────────────────────────────────────────────
function addMessage(role, text) {
  const box = document.getElementById('convoBox');
  box.querySelector('.empty-state')?.remove();

  const wrap   = document.createElement('div');
  wrap.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'agent' ? '🔴' : '🧑';

  const inner  = document.createElement('div');
  inner.className = 'msg-inner';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const time   = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

  inner.append(bubble, time);
  wrap.append(avatar, inner);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

function addThinking() {
  const box = document.getElementById('convoBox');
  const id  = 'tk_' + Date.now();
  const wrap = document.createElement('div');
  wrap.id = id; wrap.className = 'msg agent';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar'; avatar.textContent = '🔴';

  const dots = document.createElement('div');
  dots.className = 'thinking';
  dots.innerHTML = '<div class="think-dot"></div><div class="think-dot"></div><div class="think-dot"></div>';

  wrap.append(avatar, dots);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
  return id;
}
function removeThinking(id) { document.getElementById(id)?.remove(); }

// ── Alerts ─────────────────────────────────────────────────────────────────
function showAlert(msg, type='info') {
  const el = document.getElementById('alertBanner');
  el.className = `alert-banner show ${type}`;
  el.innerHTML = `<span>${type==='error'?'⚠':'ℹ'}</span> ${msg}`;
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

// ── SOS ────────────────────────────────────────────────────────────────────
function callSOS() {
  const dial = () => window.location.href = 'tel:112';
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      ({ coords: { latitude: lat, longitude: lng } }) => {
        quickSend(`SOS EMERGENCY! My location is ${lat.toFixed(5)}, ${lng.toFixed(5)}. I need immediate help!`);
        setTimeout(dial, 600);
      },
      () => { quickSend('SOS EMERGENCY! I need immediate help!'); setTimeout(dial, 600); }
    );
  } else {
    quickSend('SOS EMERGENCY! I need immediate help!');
    setTimeout(dial, 600);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
window.speechSynthesis?.getVoices(); // Pre-warm voice list

setTimeout(() => {
  const greeting = 'LifeLink is online. I am your emergency response agent. Tap the microphone and speak in any language — Telugu, English, Tamil, Kannada, or Hindi. How can I help you?';
  addMessage('agent', greeting);
  speakAzure(greeting, 'en-IN');
}, 900);
